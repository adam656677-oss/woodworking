name: Verify woodworking studio

on:
  push:
    branches: [main, 'redesign/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      CI: 'true'
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit -p .
      - name: Unit tests
        run: npx vitest run
      - name: Build application
        run: npm run build
      - name: Electron end-to-end tests (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 25
        run: npx playwright test
      - name: Upload test diagnostics
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics-${{ matrix.os }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  report-failure:
    name: Report unsuccessful verification to draft PR
    needs: verify
    if: >-
      always() && contains(fromJSON('["failure", "cancelled"]'), needs.verify.result) &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 1 &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'redesign/pro-workspace'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Publish bounded verification diagnostics
        uses: actions/github-script@v7
        with:
          script: |
            const repo = context.repo;
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              ...repo, run_id: context.runId, per_page: 100
            });
            const unsuccessful = new Set(['failure', 'cancelled', 'timed_out', 'action_required', 'startup_failure', 'stale']);
            const affected = jobs.filter(job => job.name.startsWith('Verify (') && unsuccessful.has(job.conclusion));
            const escapeHtml = value => String(value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            const sections = [];
            for (const job of affected) {
              const steps = (job.steps || []).map(step => `${step.name}: ${step.conclusion || step.status}`).join('\n') || 'No step details returned.';
              let excerpt = 'Job logs could not be retrieved; open the linked job for details.';
              try {
                const response = await github.request('GET /repos/{owner}/{repo}/actions/jobs/{job_id}/logs', { ...repo, job_id: job.id });
                const text = typeof response.data === 'string' ? response.data : Buffer.isBuffer(response.data) ? response.data.toString('utf8') : '';
                if (text) excerpt = text.slice(-10000).replace(/\u001b\[[0-9;]*m/g, '');
              } catch (error) {
                core.warning(`Unable to fetch logs for job ${job.id}: ${error.status || 'unknown status'}`);
              }
              sections.push(`### ${escapeHtml(job.name)}\nConclusion: ${escapeHtml(job.conclusion)}\n\n<pre>${escapeHtml(steps)}</pre>\n\n[Open job](${job.html_url})\n\n<details><summary>Last 10,000 log characters</summary><pre>${escapeHtml(excerpt)}</pre></details>`);
            }
            const body = `## Unsuccessful verification diagnostics\nRun ${context.runId}; head ${context.payload.pull_request.head.sha}.\n\nThese are diagnostics, not passing verification. Cancellation does not identify a root cause. Log excerpts may include project paths and build output.\n\n${sections.join('\n\n') || 'No unsuccessful verification job details were returned.'}`;
            await github.rest.issues.createComment({ ...repo, issue_number: 1, body });
