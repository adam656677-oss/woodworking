appId: com.aawoodworking.studio
productName: A&A Woodworking Studio
copyright: A&A Woodworking
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
# The text reader runs in a worker thread and reads its language data from real files, so these stay
# outside the app archive.
asarUnpack:
  - node_modules/tesseract.js/**
  - node_modules/tesseract.js-core/**
  - node_modules/@tesseract.js-data/eng/4.0.0_best_int/**
  - node_modules/libheif-js/**
win:
  target: nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: A&A Woodworking Studio
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  artifactName: A&A Woodworking Studio Setup ${version}.${ext}
fileAssociations:
  - ext: aaw
    name: A&A Project
    description: A&A Woodworking project
    icon: build/icon.ico

publish: null
